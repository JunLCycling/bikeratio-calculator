<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast 逐字稿與重點產生器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar { display: flex; justify-content: flex-end; padding: 16px 24px; }
    .icon-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }
    .page {
      display: none;
      flex: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 24px;
    }
    .page.active { display: flex; flex-direction: column; }
    #page-input { justify-content: center; align-items: center; margin-top: -6vh; }
    .hero-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; letter-spacing: 0.5px; }
    .input-row { display: flex; width: 100%; gap: 12px; }
    .url-input {
      flex: 1;
      padding: 16px 20px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
    }
    .url-input:focus { border-color: var(--accent); }
    .submit-btn {
      padding: 0 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .submit-btn:hover { background: var(--accent-hover); }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-group { display: flex; gap: 10px; }
    .episode-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; }
    .status-bar {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      word-break: break-all;
    }
    .tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-pane {
      display: none;
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-wrap;
      overflow-y: auto;
      min-height: 58vh;
    }
    .tab-pane.active { display: block; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 460px;
    }
    .modal h3 { margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="icon-btn" onclick="openSettings()">⚙️ API 設定</button>
  </div>

  <div id="page-input" class="page active">
    <div class="hero-title">Podcast 逐字稿產生器</div>
    <form class="input-row" onsubmit="handleStart(event)">
      <input
        type="url"
        id="podcast-url"
        class="url-input"
        placeholder="貼上 Apple Podcasts 單集連結或 .mp3 網址..."
        required
      />
      <button type="submit" class="submit-btn">輸入生成</button>
    </form>
  </div>

  <div id="page-result" class="page">
    <div class="result-header">
      <button class="icon-btn" onclick="goBack()">← 返回上一頁</button>
      <div class="action-group">
        <button class="icon-btn" onclick="copyCurrentTab()">複製當前分頁</button>
        <button class="icon-btn" onclick="downloadCurrentTab()">下載當前 .txt</button>
        <button class="icon-btn" onclick="downloadAll()">下載全部合併 .txt</button>
      </div>
    </div>

    <div id="ep-title" class="episode-title">準備中...</div>
    <div id="status-text" class="status-bar">正在初始化...</div>

    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="transcript" onclick="switchTab('transcript')">📄 完整逐字稿</button>
      <button class="tab-btn" data-tab="summary" onclick="switchTab('summary')">📝 內容摘要</button>
      <button class="tab-btn" data-tab="keypoints" onclick="switchTab('keypoints')">📌 條列式重點</button>
    </div>

    <div id="pane-transcript" class="tab-pane active"></div>
    <div id="pane-summary" class="tab-pane"></div>
    <div id="pane-keypoints" class="tab-pane"></div>
  </div>

  <div id="settings-modal" class="modal-overlay">
    <div class="modal">
      <h3>連線設定（僅儲存於本機瀏覽器）</h3>
      <div class="form-group">
        <label>Gemini API Key</label>
        <input type="password" id="cfg-apikey" placeholder="貼上 API Key..." />
      </div>
      <div class="form-group">
        <label>Cloudflare Worker 網址</label>
        <input type="url" id="cfg-worker" placeholder="https://podcast-proxy.你的帳號.workers.dev" />
      </div>
      <div class="modal-actions">
        <button class="icon-btn" onclick="clearSettings()">清除金鑰</button>
        <button class="icon-btn" onclick="closeSettings()">取消</button>
        <button class="submit-btn" style="padding: 8px 18px; font-size: 14px;" onclick="saveSettings()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    let currentTitle = "podcast_transcript";
    let activeTab = "transcript";

    function getConfig() {
      return {
        apiKey: (localStorage.getItem("gemini_api_key") || "").trim(),
        workerUrl: (localStorage.getItem("cf_worker_url") || "").trim().replace(/\/+$/, "")
      };
    }

    function openSettings() {
      const { apiKey, workerUrl } = getConfig();
      document.getElementById("cfg-apikey").value = apiKey;
      document.getElementById("cfg-worker").value = workerUrl;
      document.getElementById("settings-modal").classList.add("active");
    }

    function closeSettings() {
      document.getElementById("settings-modal").classList.remove("active");
    }

    function saveSettings() {
      const apiKey = document.getElementById("cfg-apikey").value.trim();
      const workerUrl = document.getElementById("cfg-worker").value.trim().replace(/\/+$/, "");
      localStorage.setItem("gemini_api_key", apiKey);
      localStorage.setItem("cf_worker_url", workerUrl);
      closeSettings();
    }

    function clearSettings() {
      localStorage.removeItem("gemini_api_key");
      localStorage.removeItem("cf_worker_url");
      document.getElementById("cfg-apikey").value = "";
      document.getElementById("cfg-worker").value = "";
      alert("已從本機瀏覽器清除 API Key！");
    }

    function switchPage(pageId) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(pageId).classList.add("active");
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.querySelectorAll(".tab-pane").forEach(pane => {
        pane.classList.remove("active");
      });
      document.getElementById(`pane-${tabName}`).classList.add("active");
    }

    function goBack() {
      switchPage("page-input");
    }

    function setStatus(msg) {
      document.getElementById("status-text").textContent = msg;
    }

    async function fetchJsonWithCorsFallback(targetUrl) {
      const routes = [
        targetUrl,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];
      for (const route of routes) {
        try {
          const res = await fetch(route);
          if (res.ok) return await res.json();
        } catch (e) {}
      }
      throw new Error("無法連線至 Apple iTunes API");
    }

    async function resolvePodcastInBrowser(inputUrl) {
      if (!inputUrl.includes("podcasts.apple.com")) {
        return { audioUrl: inputUrl, title: "Podcast Audio" };
      }
      const podcastIdMatch = inputUrl.match(/id(\d+)/);
      const episodeIdMatch = inputUrl.match(/[?&]i=(\d+)/);
      if (!podcastIdMatch) throw new Error("無法從網址辨識節目 ID");

      const podcastId = podcastIdMatch[1];
      const episodeId = episodeIdMatch ? episodeIdMatch[1] : null;

      const lookupUrl = `https://itunes.apple.com/lookup?id=${podcastId}&entity=podcastEpisode&limit=200`;
      const lookupData = await fetchJsonWithCorsFallback(lookupUrl);

      if (!lookupData.results || lookupData.results.length === 0) {
        throw new Error("iTunes API 找不到此節目");
      }

      const episodes = lookupData.results.slice(1);
      if (episodeId) {
        const matchedEp = episodes.find(ep => String(ep.trackId) === String(episodeId));
        if (matchedEp && matchedEp.episodeUrl) {
          return { audioUrl: matchedEp.episodeUrl, title: matchedEp.trackName };
        }
      } else if (episodes.length > 0 && episodes[0].episodeUrl) {
        return { audioUrl: episodes[0].episodeUrl, title: episodes[0].trackName };
      }
      throw new Error("找不到此單集的音檔連結");
    }

    async function downloadAudioBlob(audioUrl, workerUrl) {
      const proxyUrl = `${workerUrl}?audioUrl=${encodeURIComponent(audioUrl)}`;
      let res;
      try {
        res = await fetch(proxyUrl);
      } catch (err) {
        throw new Error(`無法連上 Worker (${workerUrl}) (${err.message})`);
      }

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Worker 下載音檔失敗 (${res.status}): ${errText}`);
      }

      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        setStatus(`步驟 2/4：正在讀取音檔串流... 已接收 ${(received / 1048576).toFixed(1)} MB`);
      }

      return new Blob(chunks, { type: res.headers.get("content-type") || "audio/mpeg" });
    }

    async function uploadBlobToGemini(blob, title, apiKey) {
      setStatus(`步驟 3/4：正在將音檔 (${(blob.size / 1048576).toFixed(1)} MB) 上傳至 Gemini...`);
      const initRes = await fetch(
        `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`,
        {
          method: "POST",
          headers: {
            "X-Goog-Upload-Protocol": "resumable",
            "X-Goog-Upload-Command": "start",
            "X-Goog-Upload-Header-Content-Length": blob.size.toString(),
            "X-Goog-Upload-Header-Content-Type": blob.type || "audio/mpeg",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ file: { display_name: title } })
        }
      );

      if (!initRes.ok) {
        const errText = await initRes.text();
        throw new Error(`Gemini API 初始化失敗 (${initRes.status}): ${errText}`);
      }

      const uploadUrl = initRes.headers.get("x-goog-upload-url");
      const uploadRes = await fetch(uploadUrl, {
        method: "POST",
        headers: {
          "Content-Length": blob.size.toString(),
          "X-Goog-Upload-Offset": "0",
          "X-Goog-Upload-Command": "upload, finalize"
        },
        body: blob
      });

      if (!uploadRes.ok) {
        const errText = await uploadRes.text();
        throw new Error(`音檔上傳 Gemini 失敗 (${uploadRes.status}): ${errText}`);
      }

      const data = await uploadRes.json();
      return data.file;
    }

    function renderSections(fullText) {
      const sumMarker = "===SUMMARY===";
      const kpMarker = "===KEYPOINTS===";
      const trMarker = "===TRANSCRIPT===";

      const sumIdx = fullText.indexOf(sumMarker);
      const kpIdx = fullText.indexOf(kpMarker);
      const trIdx = fullText.indexOf(trMarker);

      let summaryText = "";
      let keypointsText = "";
      let transcriptText = "";

      if (sumIdx !== -1) {
        const sumStart = sumIdx + sumMarker.length;
        const sumEnd = kpIdx !== -1 ? kpIdx : (trIdx !== -1 ? trIdx : fullText.length);
        summaryText = fullText.slice(sumStart, sumEnd).trim();
      }

      if (kpIdx !== -1) {
        const kpStart = kpIdx + kpMarker.length;
        const kpEnd = trIdx !== -1 ? trIdx : fullText.length;
        keypointsText = fullText.slice(kpStart, kpEnd).trim();
      }

      if (trIdx !== -1) {
        const trStart = trIdx + trMarker.length;
        transcriptText = fullText.slice(trStart).trim();
      } else if (sumIdx === -1 && kpIdx === -1) {
        transcriptText = fullText;
      }

      document.getElementById("pane-summary").textContent = summaryText || "（正在生成內容摘要...）";
      document.getElementById("pane-keypoints").textContent = keypointsText || "（正在生成條列式重點...）";
      document.getElementById("pane-transcript").textContent = transcriptText || "（正在完成前段摘要與重點，隨即開始印出完整逐字稿...）";
    }

    // 內建 503 伺服器忙碌自動重試機制（免重傳音檔）
    async function requestGeminiStreamWithRetry(streamUrl, payload, maxRetries = 4) {
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        const res = await fetch(streamUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) return res;

        const errText = await res.text();
        if ((res.status === 503 || res.status === 429) && attempt < maxRetries) {
          const waitSec = attempt * 6;
          for (let s = waitSec; s > 0; s--) {
            setStatus(`⚠️ Google 伺服器目前忙碌中 (503)，免重傳音檔，將於 ${s} 秒後自動進行第 ${attempt}/${maxRetries - 1} 次重試...`);
            await new Promise(r => setTimeout(r, 1000));
          }
          setStatus(`步驟 4/4：正在重新請求 Gemini 生成內容 (第 ${attempt} 次重試)...`);
          continue;
        }

        throw new Error(`Gemini 生成失敗: ${errText}`);
      }
    }

    async function handleStart(e) {
      e.preventDefault();
      const url = document.getElementById("podcast-url").value.trim();
      const { apiKey, workerUrl } = getConfig();

      if (!apiKey || !workerUrl) {
        alert("請先點擊右上角「⚙️ API 設定」填入 Gemini API Key 與 Worker 網址。");
        openSettings();
        return;
      }

      switchPage("page-result");
      switchTab("transcript");

      document.getElementById("pane-transcript").textContent = "準備中...";
      document.getElementById("pane-summary").textContent = "準備中...";
      document.getElementById("pane-keypoints").textContent = "準備中...";
      const titleEl = document.getElementById("ep-title");
      titleEl.textContent = "解析單集資訊中...";

      try {
        setStatus("步驟 1/4：正在從 Apple 取得單集音檔連結...");
        const { audioUrl, title } = await resolvePodcastInBrowser(url);
        currentTitle = title || "Podcast 單集";
        titleEl.textContent = currentTitle;

        const audioBlob = await downloadAudioBlob(audioUrl, workerUrl);
        const fileInfo = await uploadBlobToGemini(audioBlob, currentTitle, apiKey);

        let state = fileInfo.state;
        while (state === "PROCESSING") {
          setStatus("步驟 3/4：等待 Gemini 音訊處理就緒...");
          await new Promise(r => setTimeout(r, 2500));
          const checkRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileInfo.name}?key=${apiKey}`);
          const checkData = await checkRes.json();
          state = checkData.state;
          if (state === "FAILED") throw new Error("Gemini 音訊處理失敗");
        }

        setStatus("步驟 4/4：正在即時生成「摘要」、「條列重點」與「完整逐字稿」...");
        const streamUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:streamGenerateContent?alt=sse&key=${apiKey}`;

        const promptText = `請仔細聆聽這段 Podcast 音檔，並嚴格依照以下三個區塊的標記順序輸出內容（請務必保留 ===SUMMARY===、===KEYPOINTS===、===TRANSCRIPT=== 這三個英文標記，不要修改標記文字）：

===SUMMARY===
請用繁體中文撰寫這集節目的「內容摘要」（約 300～500 字，包含節目核心主題、討論脈絡與整體結論）。

===KEYPOINTS===
請用繁體中文以「條列式（Bullet points）」整理出這集節目的所有關鍵重點、核心觀點、提到的具體人物/數據/事件與結論（請分主題清楚條列）。

===TRANSCRIPT===
請將這段 Podcast 音檔轉錄為完整、從頭到尾不省略的逐字稿。請自動區分不同講者（例如：講者 A、講者 B 或主持人、來賓），並每隔一個段落標註大致的時間戳記 [MM:SS]。逐字稿請維持原音檔的語言輸出。`;

        const geminiRes = await requestGeminiStreamWithRetry(streamUrl, {
          contents: [
            {
              role: "user",
              parts: [
                { file_data: { mime_type: fileInfo.mimeType || "audio/mpeg", file_uri: fileInfo.uri } },
                { text: promptText }
              ]
            }
          ],
          generationConfig: { temperature: 0.2 }
        });

        const reader = geminiRes.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let fullOutput = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const jsonStr = line.slice(6).trim();
              if (!jsonStr || jsonStr === "[DONE]") continue;
              try {
                const data = JSON.parse(jsonStr);
                const textChunk = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                fullOutput += textChunk;
                renderSections(fullOutput);
              } catch (e) {}
            }
          }
        }

        setStatus("✅ 摘要、條列重點與逐字稿皆已生成完成！");
      } catch (err) {
        setStatus(`❌ 發生錯誤：${err.message}`);
      }
    }

    function copyCurrentTab() {
      const text = document.getElementById(`pane-${activeTab}`).textContent;
      if (!text) return;
      navigator.clipboard.writeText(text);
      const tabNames = { transcript: "完整逐字稿", summary: "內容摘要", keypoints: "條列式重點" };
      alert(`已複製「${tabNames[activeTab]}」到剪貼簿！`);
    }

    function downloadCurrentTab() {
      const text = document.getElementById(`pane-${activeTab}`).textContent;
      if (!text) return;
      const tabNames = { transcript: "逐字稿", summary: "內容摘要", keypoints: "條列重點" };
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${currentTitle}_${tabNames[activeTab]}.txt`;
      a.click();
    }

    function downloadAll() {
      const sum = document.getElementById("pane-summary").textContent;
      const kp = document.getElementById("pane-keypoints").textContent;
      const tr = document.getElementById("pane-transcript").textContent;
      const combined = `【節目名稱】${currentTitle}\n\n====================\n📝 內容摘要\n====================\n${sum}\n\n====================\n📌 條列式重點\n====================\n${kp}\n\n====================\n📄 完整逐字稿\n====================\n${tr}\n`;
      const blob = new Blob([combined], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${currentTitle}_完整報告.txt`;
      a.click();
    }
  </script>
</body>
</html>
