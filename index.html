<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast 逐字稿產生器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 16px 24px;
    }
    .icon-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    .page {
      display: none;
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
    }
    .page.active { display: flex; flex-direction: column; }

    #page-input {
      justify-content: center;
      align-items: center;
      margin-top: -6vh;
    }
    .hero-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .input-row {
      display: flex;
      width: 100%;
      gap: 12px;
    }
    .url-input {
      flex: 1;
      padding: 16px 20px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border 0.2s;
    }
    .url-input:focus { border-color: var(--accent); }
    .submit-btn {
      padding: 0 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: var(--accent-hover); }
