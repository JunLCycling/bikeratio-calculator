<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podcast 逐字稿產生器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 16px 24px;
    }
    .icon-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }

    .page {
      display: none;
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
    }
    .page.active { display: flex; flex-direction: column; }

    #page-input {
      justify-content: center;
      align-items: center;
      margin-top: -6vh;
    }
    .hero-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .input-row {
      display: flex;
      width: 100%;
      gap: 12px;
    }
    .url-input {
      flex: 1;
      padding: 16px 20px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border 0.2s;
    }
    .url-input:focus { border-color: var(--accent); }
    .submit-btn {
      padding: 0 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: var(--accent-hover); }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-group { display: flex; gap: 10px; }
    .episode-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    .status-bar {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
    }
    .transcript-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      line-height: 1.8;
      font-size: 16px;
      white-space: pre-wrap;
      overflow-y: auto;
      min-height: 60vh;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 90%;
      max-width: 460px;
    }
    .modal h3 { margin-bottom: 16px; font-size: 18px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="icon-btn" onclick="openSettings()">⚙️ API 設定</button>
  </div>

  <!-- 頁面 1：輸入網址 -->
  <div id="page-input" class="page active">
    <div class="hero-title">Podcast 逐字稿產生器</div>
    <form class="input-row" onsubmit="handleStart(event)">
      <input
        type="url"
        id="podcast-url"
        class="url-input"
        placeholder="貼上 Apple Podcasts 單集連結或 .mp3 網址..."
        required
      />
      <button type="submit" class="submit-btn">輸入生成</button>
    </form>
  </div>

  <!-- 頁面 2：生成結果頁 -->
  <div id="page-result" class="page">
    <div class="result-header">
      <button class="icon-btn" onclick="goBack()">← 返回上一頁</button>
      <div class="action-group">
        <button class="icon-btn" onclick="copyTranscript()">複製全文</button>
        <button class="icon-btn" onclick="downloadTranscript()">下載 .txt</button>
      </div>
    </div>
    <div id="ep-title" class="episode-title">準備中...</div>
    <div id="status-text" class="status-bar">正在初始化...</div>
    <div id="transcript-output" class="transcript-box"></div>
  </div>

  <!-- 設定 Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal">
      <h3>連線設定（僅儲存於本機瀏覽器）</h3>
      <div class="form-group">
        <label>Gemini API Key</label>
        <input type="password" id="cfg-apikey" placeholder="AIzaSy..." />
      </div>
      <div class="form-group">
        <label>Cloudflare Worker 網址</label>
        <input type="url" id="cfg-worker" placeholder="https://podcast-proxy.你的帳號.workers.dev" />
      </div>
      <div class="modal-actions">
        <button class="icon-btn" onclick="clearSettings()">清除金鑰</button>
        <button class="icon-btn" onclick="closeSettings()">取消</button>
        <button class="submit-btn" style="padding: 8px 18px; font-size: 14px;" onclick="saveSettings()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    let currentTitle = "podcast_transcript";

    function getConfig() {
      return {
        apiKey: localStorage.getItem("gemini_api_key") || "",
        workerUrl: localStorage.getItem("cf_worker_url") || ""
      };
    }

    function openSettings() {
      const { apiKey, workerUrl } = getConfig();
      document.getElementById("cfg-apikey").value = apiKey;
      document.getElementById("cfg-worker").value = workerUrl;
      document.getElementById("settings-modal").classList.add("active");
    }

    function closeSettings() {
      document.getElementById("settings-modal").classList.remove("active");
    }

    function saveSettings() {
      const apiKey = document.getElementById("cfg-apikey").value.trim();
      const workerUrl = document.getElementById("cfg-worker").value.trim();
      localStorage.setItem("gemini_api_key", apiKey);
      localStorage.setItem("cf_worker_url", workerUrl);
      closeSettings();
    }

    function clearSettings() {
      localStorage.removeItem("gemini_api_key");
      localStorage.removeItem("cf_worker_url");
      document.getElementById("cfg-apikey").value = "";
      document.getElementById("cfg-worker").value = "";
      alert("已從本機瀏覽器清除 API Key！");
    }

    function switchPage(pageId) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(pageId).classList.add("active");
    }

    function goBack() {
      switchPage("page-input");
    }

    function setStatus(msg) {
      document.getElementById("status-text").textContent = msg;
    }

    // 由使用者自己的瀏覽器直接查詢 Apple iTunes API（完全避開 Cloudflare IP 被擋 403）
    async function resolvePodcastInBrowser(inputUrl) {
      if (!inputUrl.includes("podcasts.apple.com")) {
        return { audioUrl: inputUrl, title: "Podcast Audio" };
      }

      const podcastIdMatch = inputUrl.match(/id(\d+)/);
      const episodeIdMatch = inputUrl.match(/[?&]i=(\d+)/);
      if (!podcastIdMatch) {
        throw new Error("無法從 Apple Podcasts 網址辨識節目 ID");
      }

      const podcastId = podcastIdMatch[1];
      const episodeId = episodeIdMatch ? episodeIdMatch[1] : null;

      const lookupUrl = `https://itunes.apple.com/lookup?id=${podcastId}&entity=podcastEpisode&limit=200`;
      const lookupRes = await fetch(lookupUrl);
      if (!lookupRes.ok) {
        throw new Error(`iTunes API 查詢失敗 (HTTP ${lookupRes.status})`);
      }
      const lookupData = await lookupRes.json();

      if (!lookupData.results || lookupData.results.length === 0) {
        throw new Error("iTunes API 找不到此節目");
      }

      const episodes = lookupData.results.slice(1);

      if (episodeId) {
        const matchedEp = episodes.find(ep => String(ep.trackId) === String(episodeId));
        if (matchedEp && matchedEp.episodeUrl) {
          return { audioUrl: matchedEp.episodeUrl, title: matchedEp.trackName };
        }
      } else if (episodes.length > 0 && episodes[0].episodeUrl) {
        return { audioUrl: episodes[0].episodeUrl, title: episodes[0].trackName };
      }

      throw new Error("找不到此單集的音檔連結（可能為付費訂閱專屬或過舊單集）");
    }

    async function handleStart(e) {
      e.preventDefault();
      const url = document.getElementById("podcast-url").value.trim();
      const { apiKey, workerUrl } = getConfig();

      if (!apiKey || !workerUrl) {
        alert("首次使用請先點擊右上角「⚙️ API 設定」填入你自己的 Gemini API Key 與 Worker 網址。");
        openSettings();
        return;
      }

      switchPage("page-result");
      const outputEl = document.getElementById("transcript-output");
      const titleEl = document.getElementById("ep-title");
      outputEl.textContent = "";
      titleEl.textContent = "解析單集資訊中...";

      try {
        // 1. 先由本機瀏覽器直接向 Apple 取得真實音檔網址
        setStatus("步驟 1/4：正在從 Apple 取得單集音檔連結...");
        const { audioUrl, title } = await resolvePodcastInBrowser(url);
        currentTitle = title || "Podcast 單集";
        titleEl.textContent = currentTitle;

        // 2. 交由 Cloudflare Worker 在雲端高速將音檔灌入 Gemini
        setStatus("步驟 2/4：正在將音檔由雲端串流傳送至 Gemini...");
        const workerRes = await fetch(workerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audioUrl, title: currentTitle, apiKey })
        });

        const fileInfo = await workerRes.json();
        if (!workerRes.ok || fileInfo.error) {
          throw new Error(fileInfo.error || "Worker 傳送失敗");
        }

        // 3. 確認 Gemini 音檔狀態為 ACTIVE
        setStatus("步驟 3/4：等待 Gemini 音訊處理就緒...");
        let state = fileInfo.state;
        while (state === "PROCESSING") {
          await new Promise(r => setTimeout(r, 2500));
          const checkRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileInfo.fileName}?key=${apiKey}`);
          const checkData = await checkRes.json();
          state = checkData.state;
          if (state === "FAILED") throw new Error("Gemini 音訊處理失敗");
        }

        // 4. 呼叫 Gemini 2.5 Flash 串流生成逐字稿
        setStatus("步驟 4/4：正在即時生成逐字稿（長音檔約需 1～2 分鐘）...");
        const streamUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${apiKey}`;

        const geminiRes = await fetch(streamUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [
                  { file_data: { mime_type: fileInfo.mimeType, file_uri: fileInfo.fileUri } },
                  { text: "請將這段 Podcast 音檔轉錄為完整、不省略的逐字稿。請自動區分不同講者（例如：講者 A、講者 B 或主持人、來賓），並每隔一個段落標註大致的時間戳記 [MM:SS]。音檔是什麼語言就用什麼語言輸出。" }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.2
            }
          })
        });

        if (!geminiRes.ok) {
          const errText = await geminiRes.text();
          throw new Error(`Gemini 生成失敗: ${errText}`);
        }

        const reader = geminiRes.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const jsonStr = line.slice(6).trim();
              if (!jsonStr || jsonStr === "[DONE]") continue;
              try {
                const data = JSON.parse(jsonStr);
                const textChunk = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                outputEl.textContent += textChunk;
              } catch (e) {}
            }
          }
        }

        setStatus("✅ 逐字稿生成完成！");
      } catch (err) {
        setStatus(`❌ 發生錯誤：${err.message}`);
      }
    }

    function copyTranscript() {
      const text = document.getElementById("transcript-output").textContent;
      if (!text) return;
      navigator.clipboard.writeText(text);
      alert("已複製逐字稿到剪貼簿！");
    }

    function downloadTranscript() {
      const text = document.getElementById("transcript-output").textContent;
      if (!text) return;
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${currentTitle}.txt`;
      a.click();
    }
  </script>
</body>
</html>
